name: Build ZMK firmware

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-

      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          west init -l config --mf west-standalone.yml
          west update --narrow
          west zephyr-export

      - name: Debug west
        run: |
          west topdir
          west list

#      - name: Build
#        run: |
#          west zmk-build -d build -q

      - name: Debug workspace
        run: |
          west list
          find dependencies -name module.yml
          find dependencies -name Kconfig | head -100

      - name: Debug zephyr
        run: |
          ls dependencies/zephyr
          ls dependencies/zephyr/soc
    
      - name: Test build settings_reset
        run: |
          west build -p always \
          -s dependencies/zmk/app \
          -b bmp_boost \
          -- \
          -DSHIELD=settings_reset
          
      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              cp "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tecla-cero
          path: artifacts
